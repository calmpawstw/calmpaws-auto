name: 每日數據收集

on:
  schedule:
    # 台灣時間每日 07:00（UTC 前一日 23:00）
    - cron: "0 23 * * *"
  workflow_dispatch:

concurrency:
  group: calmpaws-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      CP_HOME: ${{ github.workspace }}
      ALL_SECRETS: ${{ toJSON(secrets) }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: 由 Secrets 產生設定檔
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
        run: python cloud_publish.py --build-config

      - name: 收集數據
        run: |
          mkdir -p data
          python cp_analytics.py --backfill 3

      - name: 回寫資料庫
        run: |
          chmod +x git_push.sh
          ./git_push.sh "chore: 每日數據 $(date -u +%Y-%m-%d)" data/metrics.db
