name: 月度策略檢討

on:
  schedule:
    # 每月 1 日台灣時間 09:00（UTC 01:00）
    - cron: "0 1 1 * *"
  workflow_dispatch:

concurrency:
  group: calmpaws-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  review:
    runs-on: ubuntu-latest
    env:
      CP_HOME: ${{ github.workspace }}
      ALL_SECRETS: ${{ toJSON(secrets) }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: 由 Secrets 產生設定檔
        run: python cloud_publish.py --build-config

      - name: 關鍵字探勘
        run: |
          mkdir -p data
          python cp_seo.py --research --limit 25 || echo "關鍵字探勘部分失敗，繼續"

      - name: 競品分析
        run: python cp_seo.py --competitors || echo "競品分析失敗，繼續"

      - name: 產生策略檢討
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - << 'PY' > /tmp/monthly.md
          import os, sys, sqlite3, datetime as dt
          sys.path.insert(0, os.environ.get("CP_HOME", "."))

          from cp_revenue import db, ypp_status, project_ypp, revenue_summary

          conn = db()
          today = dt.date.today()
          last_month = (today.replace(day=1) - dt.timedelta(days=1)).strftime("%Y-%m")

          L = []
          L.append(f"# {last_month} 月度策略檢討\n")

          # ── 獲利路徑 ──
          st = ypp_status(conn)
          pj = project_ypp(conn)
          rate = pj.get("rate", {})
          L.append("## 獲利路徑\n")
          L.append("| 項目 | 現況 |")
          L.append("|---|---|")
          L.append(f"| 訂閱數 | {st['subs']:,} / 1,000（{st['subs_pct']}%）|")
          L.append(f"| 12 個月觀看時數 | {st['hours']:,} / 4,000（{st['hours_pct']}%）|")
          L.append(f"| 每日新增訂閱 | {rate.get('subs_per_day', 0)} |")
          L.append(f"| 每日新增時數 | {rate.get('hours_per_day', 0)} |")
          L.append(f"\n**{pj.get('verdict', '資料不足')}**\n")
          if pj.get("bottleneck"):
              L.append(f"瓶頸在**{pj['bottleneck']}**。\n")

          rev = revenue_summary(conn)
          L.append(f"累計收入 NT${rev['total_revenue_twd']:,.0f}，"
                   f"成本 NT${rev['total_cost_twd']:,.0f}，"
                   f"淨 NT${rev['net_twd']:,.0f}\n")

          # ── 主題成效 ──
          L.append("## 主題成效（近 90 天）\n")
          rows = conn.execute("""
              SELECT v.scene,
                     COUNT(*) n,
                     ROUND(AVG(m.watch_hours),1) avg_h,
                     ROUND(AVG(m.ctr),2) avg_ctr,
                     ROUND(AVG(m.views),0) avg_v
              FROM videos v JOIN video_metrics m ON m.video_id = v.video_id
              WHERE v.scene IS NOT NULL AND m.age_days BETWEEN 7 AND 90
                AND m.snapshot_date = (SELECT MAX(snapshot_date)
                                       FROM video_metrics WHERE video_id = v.video_id)
              GROUP BY v.scene ORDER BY avg_h DESC""").fetchall()
          if rows:
              L.append("| 主題 | 支數 | 平均時數 | 平均 CTR | 平均觀看 |")
              L.append("|---|---|---|---|---|")
              for r in rows:
                  L.append(f"| {r['scene']} | {r['n']} | {r['avg_h']} | "
                           f"{r['avg_ctr']}% | {r['avg_v']:,.0f} |")
              L.append("")
              if len(rows) >= 3 and rows[0]["n"] >= 3:
                  L.append(f"目前表現最好的是 **{rows[0]['scene']}**。"
                           f"樣本數 {rows[0]['n']} 支，"
                           + ("已有參考價值。\n" if rows[0]["n"] >= 5
                              else "樣本仍少，先當方向不當結論。\n"))
          else:
              L.append("尚無足夠影片數據。\n")

          # ── 關鍵字機會 ──
          L.append("## 關鍵字機會\n")
          kws = conn.execute("""
              SELECT term, lang, opportunity, top_median_views, top_median_subs
              FROM keywords WHERE opportunity > 0
              ORDER BY opportunity DESC LIMIT 12""").fetchall()
          if kws:
              L.append("| 關鍵字 | 機會 | 中位觀看 | 中位訂閱 |")
              L.append("|---|---|---|---|")
              for k in kws:
                  L.append(f"| {k['term']} | {k['opportunity']:.2f} | "
                           f"{k['top_median_views']:,} | {k['top_median_subs']:,} |")
              L.append("")
              top = [k["term"] for k in kws[:3]]
              L.append(f"建議下個月的標題與說明欄優先涵蓋：{'、'.join(top)}\n")
          else:
              L.append("關鍵字探勘無結果，可能是 API 配額或授權問題。\n")

          # ── 競品 ──
          L.append("## 競品動態\n")
          comps = conn.execute("""
              SELECT title, subs, recent_uploads, avg_recent_views
              FROM competitors ORDER BY subs DESC LIMIT 10""").fetchall()
          if comps:
              L.append("| 頻道 | 訂閱 | 近 30 天上片 | 近期均觀看 |")
              L.append("|---|---|---|---|")
              for c in comps:
                  L.append(f"| {c['title']} | {c['subs']:,} | "
                           f"{c['recent_uploads']} | {c['avg_recent_views']:,} |")
              L.append("")
              small = [c for c in comps if c["subs"] < 50000]
              if small:
                  avg_up = sum(c["recent_uploads"] for c in small) / len(small)
                  L.append(f"訂閱數 5 萬以下的同類頻道，近 30 天平均上片 "
                           f"{avg_up:.1f} 支。這是比較實際的對照組 —— "
                           f"百萬訂閱頻道的做法不一定適用於起步階段。\n")
          else:
              L.append("尚無競品資料。\n")

          # ── 風險 ──
          L.append("## 風險\n")
          flags = conn.execute("""
              SELECT severity, kind, detail FROM policy_flags
              WHERE ts >= date('now','-30 day')
              GROUP BY kind ORDER BY severity""").fetchall()
          if flags:
              for f in flags:
                  icon = "🔴" if f["severity"] == "critical" else "🟡"
                  L.append(f"- {icon} **{f['kind']}** — {f['detail']}")
          else:
              L.append("- 🟢 近 30 天未偵測到異常")
          L.append("")

          n_scenes = conn.execute(
              "SELECT COUNT(DISTINCT value) n FROM arms "
              "WHERE dimension='scene' AND active=1").fetchone()["n"]
          L.append(f"目前有 {n_scenes} 個活躍主題。以每週 2-3 支的節奏，"
                   f"約 {round(n_scenes/2.5, 1)} 週輪完一輪。"
                   f"輪替週期過短會提高被判定為重複內容的風險。\n")

          # ── 待辦 ──
          L.append("## 這個月該做的事\n")
          todo = []
          if not rate.get("reliable"):
              todo.append("持續產出，累積到至少 21 天有效數據才能判斷趨勢")
          if st["subs"] < 100:
              todo.append("訂閱數仍低。現階段該盯的是**曝光次數**有沒有成長，"
                          "那才是演算法願意推播的訊號")
          if kws:
              todo.append(f"把 {kws[0]['term']} 這類高機會關鍵字放進標題與說明欄")
          if rev["total_revenue_twd"] == 0:
              todo.append("尚無任何收入。聯盟行銷無門檻，可先在說明欄放 1-2 條"
                          "相關商品連結測水溫（用 cp_revenue.py --link 產生）")
          if n_scenes < 8:
              todo.append("考慮增加主題以拉長輪替週期")
          if not todo:
              todo.append("維持現有節奏，觀察數據")
          for i, t in enumerate(todo, 1):
              L.append(f"{i}. {t}")

          conn.close()
          print("\n".join(L))
          PY

          gh issue create \
            --title "📈 安寵 Calm Paws 月度策略檢討 $(date -u -d '+8 hours' +%Y-%m)" \
            --body-file /tmp/monthly.md \
            --label "月度檢討" 2>/dev/null || \
          gh issue create \
            --title "📈 安寵 Calm Paws 月度策略檢討 $(date -u +%Y-%m)" \
            --body-file /tmp/monthly.md

      - name: 回寫資料庫
        if: always()
        run: |
          chmod +x git_push.sh
          ./git_push.sh "chore: 月度檢討 $(date -u +%Y-%m)" data/metrics.db
