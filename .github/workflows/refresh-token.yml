name: Instagram Token 續期

# Instagram 長效 Token 有效期 60 天，且必須在到期「前」續期。
# 一旦過期就只能手動重新授權，所以這裡每 14 天跑一次，留足緩衝。

on:
  schedule:
    - cron: "0 3 */14 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: 續期並更新 Secret
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ 缺少 GH_PAT，無法更新 Secret"
            echo "請建立 fine-grained PAT（權限：Secrets 讀寫）並存為 GH_PAT"
            exit 1
          fi

          RESP=$(curl -s \
            "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${IG_ACCESS_TOKEN}")

          NEW=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('access_token',''))")
          EXP=$(echo "$RESP" | python3 -c "import sys,json;print(json.load(sys.stdin).get('expires_in',0))")

          if [ -z "$NEW" ]; then
            echo "❌ 續期失敗：$RESP"
            exit 1
          fi

          DAYS=$((EXP / 86400))
          echo "✅ 新 Token 有效期 ${DAYS} 天"

          gh secret set IG_ACCESS_TOKEN --body "$NEW"
          echo "✅ Secret 已更新"
          echo "REFRESH_DAYS=$DAYS" >> $GITHUB_ENV

      - name: 續期失敗時開 Issue 通知
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🔑 Instagram Token 續期失敗 — 需要手動處理" \
            --body "自動續期失敗，Token 可能已過期或權限不足。

          **影響**：Instagram 自動發文與數據收集會停止。

          **處理方式**：在 Mac 上重新執行 \`IG直連上線.command\` 取得新 Token，
          然後到 Settings → Secrets → Actions 更新 \`IG_ACCESS_TOKEN\`。

          [執行紀錄](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" \
            --label "需要處理" || true
