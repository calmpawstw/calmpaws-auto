name: 每週一營運報告

on:
  schedule:
    # 台灣時間週一 09:00（UTC 週一 01:00）
    # 刻意比 YouTube 長片（UTC 00:00）晚一小時，
    # 也在每日數據收集（UTC 週日 23:00）之後，確保報告用的是最新數據
    - cron: "0 1 * * 1"
  workflow_dispatch:

concurrency:
  group: calmpaws-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      CP_HOME: ${{ github.workspace }}
      ALL_SECRETS: ${{ toJSON(secrets) }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -q -r requirements.txt

      - name: 由 Secrets 產生設定檔
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_CLIENT_SECRET_JSON: ${{ secrets.YT_CLIENT_SECRET_JSON }}
        run: python cloud_publish.py --build-config

      - name: 收集最新數據
        run: |
          mkdir -p data reports
          python cp_analytics.py --backfill 8 || echo "收集部分失敗，繼續"

      - name: 更新優化信念
        run: python cp_optimizer.py --update | tee /tmp/opt.json

      - name: 產生報告
        run: python cp_report.py --no-open

      - name: 準備 GitHub Pages 內容
        run: |
          mkdir -p _site
          cp reports/latest.html _site/index.html
          cp reports/*.html _site/ 2>/dev/null || true
          # 簡單索引頁
          {
            echo '<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8">'
            echo '<title>安寵 Calm Paws 歷史報告</title>'
            echo '<style>body{background:#0f1115;color:#e6e8ec;font-family:-apple-system,"PingFang TC",sans-serif;padding:40px;max-width:700px;margin:0 auto}a{color:#7aa2f7;display:block;padding:10px 0;text-decoration:none}a:hover{text-decoration:underline}h1{font-size:22px}</style>'
            echo '</head><body><h1>安寵 Calm Paws 歷史報告</h1>'
            echo '<a href="index.html"><b>最新報告</b></a>'
            for f in $(ls -r reports/weekly_*.html 2>/dev/null); do
              b=$(basename "$f")
              echo "<a href=\"$b\">${b%.html}</a>"
            done
            echo '</body></html>'
          } > _site/archive.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: 建立週報 Issue（會寄信通知）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - << 'PY' > /tmp/issue.md
          import json, sqlite3, os
          from pathlib import Path

          p = Path('reports')
          js = sorted(p.glob('weekly_*.json'))
          d = json.loads(js[-1].read_text(encoding='utf-8')) if js else {}

          ypp = d.get('ypp', {})
          wk  = d.get('weekly', {})
          def g(k, f):
              return (wk.get(k) or {}).get(f, 0)

          def arrow(v):
              if v is None: return '—'
              return f'▲ {v}%' if v > 0 else (f'▼ {abs(v)}%' if v < 0 else '— 0%')

          site = os.environ.get('PAGES_URL', '')
          lines = []
          lines.append('## 北極星指標\n')
          lines.append(f"| 指標 | 進度 |")
          lines.append(f"|---|---|")
          lines.append(f"| 訂閱數 | **{ypp.get('subs',0):,} / 1,000** （{ypp.get('subs_pct',0)}%） |")
          lines.append(f"| 12 個月觀看時數 | **{ypp.get('wh',0):,} / 4,000 小時** （{ypp.get('wh_pct',0)}%） |")
          lines.append(f"| Instagram 追蹤者 | {ypp.get('ig_followers',0):,} |")
          lines.append('\n## 本週表現\n')
          lines.append('| 指標 | 本週 | 對比上週 | 4 週均 |')
          lines.append('|---|---|---|---|')
          lines.append(f"| 觀看次數 | {g('views','cur'):,} | {arrow(g('views','delta'))} | {g('views','avg4'):,} |")
          lines.append(f"| 觀看時數 | {g('watch_hours','cur'):,} | {arrow(g('watch_hours','delta'))} | {g('watch_hours','avg4'):,} |")
          lines.append(f"| 新增訂閱 | {g('subs','cur'):,} | {arrow(g('subs','delta'))} | {g('subs','avg4'):,} |")

          flags = d.get('flags', [])
          crit = [f for f in flags if f.get('severity') == 'critical']
          warn = [f for f in flags if f.get('severity') == 'warn']
          lines.append('\n## 風險燈號\n')
          if crit:
              lines.append('🔴 **需要立即處理**\n')
          elif warn:
              lines.append('🟡 **有待觀察**\n')
          else:
              lines.append('🟢 運作正常\n')
          for f in flags:
              icon = '🔴' if f.get('severity') == 'critical' else '🟡'
              lines.append(f"- {icon} **{f.get('kind')}** — {f.get('detail')}")

          dec = d.get('decisions', [])
          lines.append('\n## 本週自動調整\n')
          if dec:
              for x in dec:
                  lines.append(f"- **{x.get('dimension')}** {x.get('action')}：{x.get('detail')}")
          else:
              lines.append('- 無變更')

          plan = d.get('plan', [])
          lines.append('\n## 下週產出計畫\n')
          for i, pl in enumerate(plan, 1):
              parts = ' · '.join(f'{k}={v}' for k, v in pl.items())
              lines.append(f"{i}. {parts}")

          if site:
              lines.append(f"\n---\n\n📊 [完整報告]({site}) ｜ [歷史報告]({site}archive.html)")

          print('\n'.join(lines))
          PY

          PAGES_URL="${{ steps.deploy.outputs.page_url }}" \
            gh issue create \
              --title "📊 安寵 Calm Paws 週報 $(date -u -d '+8 hours' +%Y-%m-%d)" \
              --body-file /tmp/issue.md \
              --label "週報" || \
            gh issue create \
              --title "📊 安寵 Calm Paws 週報 $(date -u +%Y-%m-%d)" \
              --body-file /tmp/issue.md

      - name: 回寫報告與資料庫
        if: always()
        run: |
          chmod +x git_push.sh
          ./git_push.sh "chore: 週報 $(date -u +%Y-%m-%d)" data/metrics.db reports
