# 安寵 Calm Paws — 標題句型
#
# 每個場景四種句型，供優化引擎測試哪一種點閱率最好。
# 全部手寫，不用程式自動生成 —— 中文句法自動接詞很容易產出
# 「打雷放鞭炮不再怕怎麼辦？」這種讀不通的標題，
# 而優化引擎會誤判成「這個句型不好」，實際上是模板寫壞了。
#
# 規則：
#   {duration} 必填，會被替換成「8 小時」之類
#   YouTube 標題上限 100 字元，中文約 50 字
#   日後想改標題直接編輯這個檔案，重跑 套用優化修正.command

separation_anxiety:
  problem_first:  "狗狗一個人在家會怕嗎？分離焦慮舒緩音樂 {duration} 🐾｜安寵 Calm Paws"
  scenario_first: "上班族不在家｜狗狗分離焦慮療癒音樂 {duration} 🐾｜安寵 Calm Paws"
  outcome_first:  "讓狗狗安心等你回家｜分離焦慮療癒音樂 {duration} 🐾｜安寵 Calm Paws"
  duration_first: "{duration} 不間斷陪伴｜狗狗分離焦慮療癒音樂 🐾｜安寵 Calm Paws"

